<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Franco Conte</title>
<meta name="description" content="Get in touch with Franco Conte, Milan-based sound designer and composer at info@franco-conte.com for collaborations and inquiries.">
<link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="icon" type="image/png" href="favicon.png">
<style>
  @font-face { font-family: "Bebas Neue"; src: url("fonts/BebasNeue.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Syne"; src: url("fonts/Syne-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Syne"; src: url("fonts/Syne-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
  @font-face { font-family: "Syne"; src: url("fonts/Syne-400.woff2") format("woff2"); font-weight: 300; font-style: normal; font-display: swap; }
  @font-face { font-family: "Cormorant"; src: url("fonts/Cormorant-300-Italic.woff2") format("woff2"); font-weight: 300; font-style: italic; font-display: swap; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --fg: #f0ede8;
    --muted: #555;
    --accent: #41d14c;
    --border: rgba(240,237,232,0.1);
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.04em;
    cursor: none;
    overflow-x: hidden;
  }

  /* CURSOR */
  .cursor {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 12px;
    height: 12px;
    transition: width 0.35s cubic-bezier(0.34,1.56,0.64,1),
                height 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .cursor .cursor-dot {
    position: absolute;
    width: 7px; height: 7px;
    background: var(--fg);
    border-radius: 50%;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .cursor .cursor-star {
    position: absolute;
    width: 100%; height: 100%;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    transform: scale(0.4) rotate(-15deg);
  }
  .cursor .cursor-star svg { width: 100%; height: 100%; }
  .cursor.hover { width: 28px; height: 28px; }
  .cursor.hover .cursor-dot { opacity: 0; transform: scale(0); }
  .cursor.hover .cursor-star { opacity: 1; transform: scale(1) rotate(0deg); }
  @media (hover: none) and (pointer: coarse) {
    .cursor { display: none !important; }
    * { cursor: auto !important; }
  }
  .cursor.touch-hidden { display: none !important; }

  /* NAV */
  nav {
    position: fixed;
    top: 28px; left: 28px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 32px;
  }
  .nav-name {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-decoration: none;
    color: var(--fg);
  }
  .nav-links { display: flex; gap: 24px; }
  .nav-links a {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
    cursor: none;
    font-weight: 300;
  }
  .nav-links a:hover { color: var(--accent); }
  .nav-links a.active { color: var(--fg); }

  /* PAGE */
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 120px 40px 80px;
    max-width: 780px;
  }

  .page-label {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 40px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .page-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 8vw, 96px);
    line-height: 0.9;
    letter-spacing: 0.02em;
    margin-bottom: 56px;
  }

  .contact-email {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(28px, 4vw, 52px);
    letter-spacing: 0.02em;
    color: var(--fg);
    text-decoration: none;
    display: inline-block;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    transition: color 0.2s, border-color 0.2s;
    cursor: none;
    margin-bottom: 56px;
  }
  .contact-email:hover { color: var(--accent); border-color: var(--accent); }

  .contact-socials {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
  }

  .contact-social-link {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
    cursor: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .contact-social-link:hover { color: var(--accent); }

  .contact-social-link::before {
    content: '↗';
    font-size: 10px;
    opacity: 0.5;
  }

  .contact-divider {
    width: 40px;
    height: 1px;
    background: var(--border);
    margin: 48px 0;
  }

  .contact-based {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* FOOTER */
  footer {
    padding: 40px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }
  .footer-name {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.08em;
  }
  .footer-meta {
    font-size: 11px;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  .footer-links { display: flex; gap: 24px; }
  .footer-links a {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
    cursor: none;
  }
  .footer-links a:hover { color: var(--accent); }

  @media (max-width: 768px) {
    nav { gap: 16px; top: 20px; left: 20px; }
    .nav-links { display: flex; gap: 16px; }
    .nav-links a { font-size: 10px; }
    .page { padding: 100px 20px 60px; }
    footer { padding: 30px 20px; }
    .contact-socials { gap: 20px; }
  }
</style>
</head>
<body>

<div class="cursor" id="cursor">
  <div class="cursor-dot"></div>
  <div class="cursor-star">
    <svg viewBox="0 0 287 265" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(0,265) scale(0.1,-0.1)" fill="#41d14c" stroke="none">
        <path d="M782 1998 c56 -87 358 -618 358 -629 0 -8 -83 -156 -184 -329 -101 -173 -183 -316 -181 -318 1 -1 147 81 324 184 177 102 328 184 334 181 7 -3 153 -86 326 -186 173 -100 315 -180 316 -179 2 2 -80 145 -181 318 -101 173 -184 322 -184 330 0 8 83 157 184 330 101 173 183 316 181 318 -1 1 -147 -81 -324 -184 -178 -102 -328 -183 -334 -181 -7 3 -153 86 -326 186 -172 99 -316 181 -318 181 -3 0 1 -10 9 -22z"/>
      </g>
    </svg>
  </div>
</div>

<nav>
  <a href="index.html" class="nav-name">Franco Conte</a>
  <div class="nav-links">
    <a href="index.html#works">Works</a>
    <a href="about.html">About</a>
    <a href="contact.html" class="active">Contact</a>
  </div>
</nav>

<main>
  <div class="page">
    <div class="page-label">Contact</div>
    <h1 class="page-title">Get in<br>touch</h1>

    <a href="mailto:info@franco-conte.com" class="contact-email">
      info@franco-conte.com
    </a>

    <div class="contact-socials">
      <a href="https://www.linkedin.com/in/franco-conte-a19707221/" target="_blank" class="contact-social-link">LinkedIn</a>
      <a href="https://www.instagram.com/frnk_cnt/" target="_blank" class="contact-social-link">Instagram</a>
      <a href="https://www.youtube.com/channel/UCMfUuHCiLvaZmtXPyPzcp3g" target="_blank" class="contact-social-link">YouTube</a>
    </div>

    <div class="contact-divider"></div>

    <span class="contact-based">Based in Milan, Italy</span>
  </div>
</main>

<footer>
  <span class="footer-name">Franco Conte</span>
  <span class="footer-meta">Sound design · Music production · Milan</span>
  <div class="footer-links">
    <a href="mailto:info@franco-conte.com">info@franco-conte.com</a>
    <a href="about.html">About</a>
  </div>
</footer>

<script>
  window.addEventListener('touchstart', () => {
    cursor.classList.add('touch-hidden');
  }, { once: true });

  const cursor = document.getElementById('cursor');
  const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

  if (!isTouch) {
    cursor.style.opacity = '0';
    let mouseX = 0, mouseY = 0, curX = 0, curY = 0;
    let hasMoved = false;
    document.addEventListener('mousemove', e => {
      mouseX = e.clientX; mouseY = e.clientY;
      if (!hasMoved) { curX = mouseX; curY = mouseY; hasMoved = true; cursor.style.opacity = '1'; }
    });
    document.addEventListener('mouseleave', () => { cursor.style.opacity = '0'; });
    document.addEventListener('mouseenter', () => { if (hasMoved) cursor.style.opacity = '1'; });
    function animateCursor() {
      curX += (mouseX - curX) * 0.27;
      curY += (mouseY - curY) * 0.27;
      cursor.style.left = curX + 'px';
      cursor.style.top = curY + 'px';
      requestAnimationFrame(animateCursor);
    }
    animateCursor();
    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
    });
  }
</script>
</body>
</html>
